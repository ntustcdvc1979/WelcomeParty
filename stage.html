<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影幕｜台科大崇德志工社 相見歡</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo1.webp">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  /* 背景：四角壓上社團色，中間留亮，字才讀得動。
     再疊一層很淡的圓點，投出來不會是一片死板的米色。 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(44rem 28rem at 6% -8%,   rgba(242,167,44,.45), transparent 62%),
      radial-gradient(40rem 26rem at 96% 0%,   rgba(169,206,59,.45), transparent 62%),
      radial-gradient(34rem 24rem at 102% 72%, rgba(14,140,143,.30), transparent 62%),
      radial-gradient(36rem 24rem at -4% 82%,  rgba(226,98,28,.28), transparent 62%),
      radial-gradient(52rem 30rem at 50% 112%, rgba(233,163,23,.32), transparent 62%),
      linear-gradient(158deg, #FFFAEB 0%, #FDF2D8 46%, #FAE7C2 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(226,98,28,.14) 1.5px, transparent 1.6px);
    background-size:28px 28px;
  }

  /* ---------- 畫面 ---------- */
  .screen{
    position:relative;z-index:1;
    flex:1;min-height:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:4vmin 6vmin;
    gap:1.2vmin;
  }
  /* 文字塊不准被壓縮。預設的 flex-shrink 會把文字框縮到比內容矮，
     文字就溢出去疊在下一塊上面——照片牆那幾頁最明顯。 */
  .screen > *{flex:none;}

  .eyebrow{
    margin:0;
    font-size:clamp(1rem,2.4vmin,1.8rem);
    font-weight:900;letter-spacing:.34em;
    color:var(--ink-2);
  }
  .huge{
    margin:0;
    font-size:clamp(3rem,13vmin,11rem);
    font-weight:900;line-height:1.05;letter-spacing:.02em;
  }
  .big{
    margin:0;
    font-size:clamp(2.2rem,8.5vmin,7rem);
    font-weight:900;line-height:1.15;
  }
  .lede{
    margin:0;
    max-width:34em;
    font-size:clamp(1.1rem,3.1vmin,2.4rem);
    line-height:1.6;color:var(--ink-2);
  }
  .lede b{color:var(--ink);}
  .quiet{color:var(--ink-2);opacity:.85;}

  .mark{background:linear-gradient(180deg,transparent 58%,rgba(169,206,59,.55) 58%);}

  /* ---------- 中英雙語 ----------
     英文字級用 em，跟著上面那行中文自動縮放，不用每個地方各調一次。 */
  .en{
    display:block;
    margin-top:.32em;
    font-size:.44em;
    font-weight:700;
    line-height:1.4;
    letter-spacing:.01em;
    color:var(--ink-2);
    opacity:.9;
  }
  .lede .en,.eyebrow .en{font-size:.78em;margin-top:.25em;font-weight:600;}
  .eyebrow .en{letter-spacing:.12em;}

  /* ---------- 首頁 ---------- */
  .logos{display:flex;align-items:center;justify-content:center;gap:2.4vmin;}
  .logos img{height:min(18vmin,10rem);width:auto;display:block;}

  .cover__sub{
    margin:0;
    font-size:clamp(1.6rem,6vmin,4.6rem);
    font-weight:900;color:var(--ink);letter-spacing:.3em;
    padding-left:.3em;
  }

  /* ---------- 三隻猴子 ---------- */
  .roles{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:1.6vmin;width:min(100%,66rem);margin-top:.6vmin;
  }
  .role{
    background:rgba(255,255,255,.8);
    border:.35vmin solid var(--paper-3);
    border-radius:1.6rem;
    padding:1.9vmin 1.6vmin;
  }
  .role__e{font-size:clamp(2.4rem,8vmin,5.4rem);line-height:1.1;}
  .role__n{
    font-size:clamp(1.15rem,3.2vmin,2.3rem);
    font-weight:900;margin:.4vmin 0 .8vmin;
  }
  .role__r{font-size:clamp(.9rem,2.3vmin,1.6rem);color:var(--ink-2);line-height:1.55;}

  .scan{
    display:flex;align-items:center;gap:2.4vmin;
    background:rgba(255,255,255,.8);
    border:.35vmin solid var(--paper-3);
    border-radius:1.6rem;padding:1.5vmin 2.2vmin;margin-top:.8vmin;
  }
  .scan .qr{width:min(22vmin,13rem);flex:none;}
  .scan__t{text-align:left;font-size:clamp(.95rem,2.5vmin,1.7rem);line-height:1.6;}
  .scan__t b{display:block;font-size:clamp(1.1rem,3vmin,2.1rem);margin-bottom:.4vmin;}
  .scan__u{font-size:clamp(.75rem,1.8vmin,1.1rem);color:var(--ink-2);word-break:break-all;}

  .pill{
    display:inline-block;
    padding:.9vmin 3vmin;border-radius:999px;
    background:var(--flame);color:#fff;
    font-size:clamp(1.1rem,3.2vmin,2.4rem);font-weight:900;letter-spacing:.08em;
  }
  .secret{
    display:flex;align-items:center;justify-content:center;gap:2vmin;
    width:min(100%,56rem);
    margin:1vmin 0;
    padding:2.6vmin 4vmin;
    border-radius:2rem;
    border:.5vmin dashed var(--paper-3);
    background:rgba(255,255,255,.55);
    font-size:clamp(1.4rem,4.6vmin,3.4rem);font-weight:900;color:var(--ink-2);
  }
  .secret span{font-size:clamp(2.4rem,9vmin,6rem);line-height:1;}
  .rolebar{
    display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vmin 3vmin;
    font-size:clamp(.95rem,2.5vmin,1.7rem);color:var(--ink-2);
  }
  .rolebar b{color:var(--ink);}

  .timer{
    font-variant-numeric:tabular-nums;
    font-size:clamp(3rem,15vmin,12rem);font-weight:900;line-height:1;
    color:var(--teal);
  }
  .timer.warn{color:var(--err);}
  .timer.idle{opacity:.28;}

  /* ---------- 社團介紹：照 pptx 排的拼貼 ---------- */
  .screen--full{display:block;padding:2vmin;}
  .collage{
    position:relative;
    /* 直接填滿畫面區域。原稿是 20 x 11.25 吋（剛好 16:9），投影幕也是 16:9，
       所以座標對得上；真的接到別的比例，照片會跟著一起被拉伸一點點，
       但每一張都是 object-fit:cover，不會變形。

       這裡刻意不用 aspect-ratio 去框比例：寬高都靠父層決定，尺寸就不會
       回頭依賴內容，下面那個 container-type 才不會跟百分比寬度打架
       （會互相等對方算完，整塊縮成 0）。 */
    width:100%;
    height:100%;
    overflow:hidden;
  }
  .collage img{
    position:absolute;
    z-index:1;
    object-fit:cover;
    border-radius:.4rem;
    box-shadow:0 .5vmin 1.4vmin rgba(64,38,15,.24);
  }
  /* 照片牆那幾頁的裝飾：貼在整個畫面上，不跟著內容排 */
  .deco--page{
    position:absolute;z-index:0;
    display:block;opacity:.85;pointer-events:none;
  }
  .deco--page svg{display:block;width:100%;height:100%;}

  /* 裝飾畫在照片後面，從縫隙露出來 */
  .collage .deco{
    position:absolute;
    z-index:0;
    display:block;
    opacity:.9;
    pointer-events:none;
  }
  /* 沒給尺寸的話瀏覽器會用它自己的預設值，圖形會被壓扁。
     撐滿外框，再交給 svg 的 preserveAspectRatio 等比例縮進去。 */
  .collage .deco svg{display:block;width:100%;height:100%;}
  .collage h1{
    position:absolute;
    z-index:2;
    margin:0;
    /* 標題一折行就會往下掉到照片上。框寬不夠就讓它超出去，
       右邊本來就是留白，比折行安全。 */
    white-space:nowrap;
    font-weight:900;
    line-height:1.2;
    color:var(--ink);
    /* pptx 是 72pt 排在 20 吋寬的版面上，剛好是版面寬度的 5% */
    font-size:clamp(1.5rem,4.9vw,5.6rem);
  }
  .collage h1 .en{white-space:normal;}
  /* 英文接在中文後面排成一行，標題區塊就不會往下長到壓住照片 */
  .collage h1.ctitle--inline .en{
    display:inline;white-space:nowrap;
    font-size:.4em;margin:0 0 0 .6em;vertical-align:.12em;
  }
  /* 綁容器寬度而不是高度：接到 4:3 投影機時，標題才不會相對變寬去壓到照片 */
  @supports (container-type:inline-size){
    .collage{container-type:inline-size;}
    .collage h1{font-size:5cqw;}
    .collage h1.ctitle--big{font-size:9cqw;}
  }

  /* ---------- 內容多的頁面 ----------
     照片牆和三隻猴子規則這幾頁，主角是照片和角色卡，不是標題。
     標題整個縮一號，把高度讓出去——不縮的話，中文加英文會把下面的東西擠出畫面。 */
  .screen--dense .eyebrow{font-size:clamp(.85rem,1.9vmin,1.3rem);}
  .screen--dense .huge{font-size:clamp(2.4rem,10vmin,8rem);}
  .screen--dense .big{font-size:clamp(1.8rem,5.6vmin,4.2rem);}
  .screen--dense .lede{font-size:clamp(.95rem,2.4vmin,1.7rem);max-width:44em;}

  /* 三隻猴子規則：只排一種語言，所以字和 QR 都放得比原本大 */
  .screen--dense .scan .qr{width:min(26vmin,15rem);}
  .screen--dense .rules__lede{font-size:clamp(1.1rem,3.1vmin,2.3rem);max-width:40em;}
  .screen--dense .role__n{font-size:clamp(1.3rem,3.8vmin,2.7rem);}
  .screen--dense .role__r{font-size:clamp(1rem,2.65vmin,1.9rem);}
  .screen--dense .scan__t{font-size:clamp(1.05rem,3vmin,2.1rem);}
  .screen--dense .scan__t b{font-size:clamp(1.2rem,3.6vmin,2.6rem);}
  /* ---------- 照片牆那幾頁 ----------
     標題跟其他頁一樣大（不套 dense），上面留一段空白，
     標題才不會頂在畫面最上緣——照片牆會把剩下的高度全部吃掉。 */
  .screen--wall{padding-top:1.5vmin;}
  .wallhead{
    display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;gap:1vmin 3vmin;
    width:100%;
  }
  .wallhead .lede{text-align:left;max-width:26em;}
  .screen--wall .lede{font-size:clamp(1.15rem,3.2vmin,2.4rem);max-width:40em;}

  .wall{
    display:flex;flex-wrap:wrap;
    justify-content:center;align-content:center;
    gap:.5rem;
    width:100%;max-width:96rem;
    /* 吃掉標題之後剩下的高度，不寫死。
       寫死 vh 的話，標題一加英文就把照片擠出畫面。
       basis 用 0：空間不夠時照片牆自己縮到沒有，也不會去擠文字。 */
    flex:1 1 0;min-height:0;
    margin-top:.4rem;
  }
  /* 填滿版：等分格線，照片裁切填滿每一格 */
  .wallgrid{
    flex:1 1 0;min-height:0;
    display:grid;
    grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
    /* 列高也要等分，不然每一列會用圖片的原始高度，整個撐爆容器 */
    grid-auto-rows:minmax(0,1fr);
    gap:.6rem;width:100%;max-width:96rem;
    margin-top:.4rem;
  }
  .wallgrid img{
    width:100%;height:100%;object-fit:cover;display:block;
    border:.28rem solid #fff;border-radius:.35rem;
    box-shadow:0 .3rem .8rem rgba(90,52,18,.28);
  }

  .wall figure{
    flex:0 0 auto;margin:0;
    border:.28rem solid #fff;
    border-radius:.35rem;
    box-shadow:0 .3rem .8rem rgba(90,52,18,.28);
    background:var(--paper-2);
    line-height:0;
  }
  .wall figure.tiltA{transform:rotate(-.6deg);}
  .wall figure.tiltB{transform:rotate(.6deg);}
  .wall .wbreak{flex:0 0 100%;height:0;margin:0;}
  .wall img{display:block;height:100%;width:auto;}
  .wall--empty{
    display:block;height:auto;
    padding:2rem;text-align:center;
    font-size:clamp(1rem,2.6vmin,1.8rem);color:var(--ink-2);
  }

  /* ---------- 社員權益 ---------- */
  .fee{
    display:inline-flex;align-items:baseline;gap:1.2vmin;
    padding:1.2vmin 4vmin;border-radius:999px;
    background:var(--gold);color:#fff;
    font-weight:900;
  }
  .fee span{font-size:clamp(1rem,2.8vmin,2rem);letter-spacing:.1em;}
  .fee b{font-size:clamp(1.8rem,6vmin,4.4rem);}

  .perks{
    list-style:none;margin:2.5vmin 0 0;padding:0;
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:2.4vmin;width:min(100%,72rem);
  }
  .perks li{
    background:rgba(255,255,255,.8);
    border:.35vmin solid var(--paper-3);
    border-radius:1.6rem;
    padding:3vmin 2vmin;
  }
  .perks .e{font-size:clamp(2.4rem,8vmin,5.4rem);line-height:1.1;}
  .perks .t{
    margin-top:1vmin;
    font-size:clamp(1.2rem,3.6vmin,2.6rem);font-weight:900;
  }
  /* 三項福利的英文要看得清楚，比預設的 .en 再大一號 */
  .perks .t .en{font-size:.56em;margin-top:.45em;}

  /* ---------- 中英切換按鈕 ---------- */
  .langbtn{
    font:inherit;font-weight:900;cursor:pointer;
    padding:.8vmin 2.4vmin;border-radius:999px;
    border:.3vmin solid var(--paper-3);
    background:rgba(255,255,255,.85);color:var(--ink-2);
    font-size:clamp(.9rem,2.2vmin,1.5rem);letter-spacing:.08em;
  }
  .langbtn:hover{border-color:var(--ink-2);color:var(--ink);}

  /* ---------- 老師 ---------- */
  .teacher{
    display:flex;align-items:center;gap:5vmin;
    width:min(100%,74rem);text-align:left;
  }
  .teacher__pic{
    flex:none;width:min(34vmin,22rem);aspect-ratio:3/4;
    border-radius:1.8rem;overflow:hidden;
    border:.5vmin solid #fff;
    box-shadow:0 1.4vmin 3vmin rgba(64,38,15,.18);
    background:var(--paper-2) center/60% no-repeat url("assets/logo1.webp");
  }
  .teacher__pic img{width:100%;height:100%;object-fit:cover;display:block;}
  .teacher__n{margin:0;font-size:clamp(2rem,7vmin,5rem);font-weight:900;line-height:1.15;}
  .teacher__t{
    margin:.6vmin 0 2vmin;
    font-size:clamp(1rem,2.8vmin,2rem);font-weight:800;color:var(--flame);
  }
  .teacher__l{list-style:none;margin:0;padding:0;display:grid;gap:1.2vmin;}
  .teacher__l li{
    font-size:clamp(1rem,2.9vmin,2.1rem);line-height:1.6;color:var(--ink-2);
    padding-left:1.6vmin;border-left:.4vmin solid var(--green);
  }

  /* ---------- 抽獎 ---------- */
  .prizes{
    list-style:none;margin:2vmin 0 0;padding:0;
    display:flex;flex-wrap:wrap;justify-content:center;gap:1.6vmin;
    width:min(100%,60rem);
  }
  .prizes li{
    padding:1.4vmin 2.6vmin;border-radius:1.2rem;
    background:rgba(255,255,255,.78);
    border:.3vmin solid var(--paper-3);
    font-size:clamp(1rem,2.8vmin,2rem);font-weight:800;
  }
  .prizes li.on{background:var(--gold);border-color:var(--orange-dark);color:#fff;}
  .prizes li small{display:block;font-size:.7em;font-weight:700;opacity:.8;}

  .roll{
    width:min(100%,60rem);
    min-height:22vmin;
    display:flex;align-items:center;justify-content:center;
    margin:1vmin 0;
    padding:3vmin 4vmin;
    border-radius:2rem;
    background:rgba(255,255,255,.82);
    border:.5vmin solid var(--paper-3);
    font-size:clamp(2.4rem,11vmin,8rem);font-weight:900;line-height:1.1;
    word-break:break-all;
  }
  .roll.spin{color:var(--ink-2);opacity:.7;}
  .roll.win{
    color:var(--flame);
    border-color:var(--gold);
    box-shadow:0 0 0 .8vmin rgba(233,163,23,.28);
    animation:pop .45s ease;
  }
  .roll.empty{font-size:clamp(1.1rem,3vmin,2.2rem);font-weight:800;color:var(--ink-2);}
  @keyframes pop{
    0%{transform:scale(.82);opacity:.2;}
    60%{transform:scale(1.06);}
    100%{transform:scale(1);opacity:1;}
  }

  .won{
    display:flex;flex-wrap:wrap;justify-content:center;gap:.8vmin 1.4vmin;
    width:min(100%,72rem);
    font-size:clamp(.85rem,2.2vmin,1.5rem);
  }
  .won b{
    padding:.5vmin 1.4vmin;border-radius:999px;
    background:rgba(169,206,59,.3);font-weight:800;
  }
  .won small{font-weight:700;opacity:.7;}

  /* ---------- 大合照 ---------- */
  .bigemoji{font-size:clamp(3rem,14vmin,10rem);line-height:1;}
  .count{
    font-size:clamp(6rem,40vmin,30rem);font-weight:900;line-height:1;
    color:var(--flame);animation:pop .4s ease;
  }

  /* ---------- 抽獎那一頁的問卷 QR ---------- */
  .askqr{
    display:flex;align-items:center;gap:3vmin;
    margin-top:2vmin;padding:2vmin 3vmin;
    border-radius:1.6rem;
    background:rgba(255,255,255,.8);
    border:.35vmin solid var(--paper-3);
    text-align:left;
  }
  .askqr .qr{width:min(44vmin,26rem);flex:none;}
  .askqr--big .qr{width:min(46vmin,28rem);}
  .askqr .qr img{display:block;width:100%;height:auto;}
  /* 心得回饋那頁只有標題和 QR，所以放到最大 */
  .qr--solo{
    width:min(54vmin,34rem);
    background:#fff;border-radius:1rem;padding:1.2vmin;
    box-shadow:0 .6vmin 1.8vmin rgba(90,52,18,.24);
  }
  .qr--solo img{display:block;width:100%;height:auto;}
  .askqr__t{font-size:clamp(1rem,2.7vmin,1.9rem);line-height:1.6;color:var(--ink-2);}
  .askqr__t b{display:block;color:var(--ink);font-size:clamp(1.1rem,3.2vmin,2.3rem);}
  .askqr__t b .en{font-size:.62em;margin-top:.4em;}
  .askqr__u{font-size:clamp(.75rem,1.8vmin,1.15rem);word-break:break-all;opacity:.8;}

  /* ---------- 結束卡：QR 卡片，排法跟迎新最後一頁一樣 ---------- */
  .endhead{
    display:flex;align-items:center;justify-content:center;
    gap:3vmin;text-align:left;
  }
  .endhead .logos img{height:min(11vmin,6rem);}
  .endhead h1{margin:0;}
  .endnote{
    margin:.8vmin 0 0;
    padding:.7vmin 2vmin;
    border-radius:999px;
    background:var(--gold);color:#fff;
    font-size:clamp(.95rem,2.4vmin,1.7rem);font-weight:900;
    display:inline-block;
  }
  .endnote .en{font-size:.68em;margin-top:.2em;opacity:.95;color:#fff;}

  .ends{
    display:flex;align-items:stretch;justify-content:center;
    gap:4vmin;margin-top:2vmin;
    width:100%;height:62vh;
  }
  .end{
    display:flex;flex-direction:column;align-items:center;
    gap:1vmin;min-height:0;min-width:0;
  }
  .end__pic{
    flex:1 1 auto;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:.6vmin;
    background:#fff;border-radius:.6rem;
    box-shadow:0 .4vmin 1.2vmin rgba(90,52,18,.28);
  }
  .end__pic img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;}
  .end__pic .qr{width:auto;height:100%;aspect-ratio:1;}
  .end__pic .qr svg{width:100%;height:100%;}
  /* QR 方方正正就好，不用跟著卡片一起拉高 */
  .end--qr .end__pic{flex:0 0 auto;align-self:center;}

  .end--promo{flex:0 0 66%;}
  .end--qr{flex:0 0 24%;}

  /* 近期活動：三欄兩排，六張各自照原比例縮進格子裡 */
  .promowall{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:.8vmin;width:100%;
    place-items:center;
  }
  .promowall img{
    max-width:100%;max-height:100%;width:auto;height:auto;display:block;
    border:.3rem solid #fff;border-radius:.5rem;
    box-shadow:0 .35rem .9rem rgba(90,52,18,.26);
  }
  .end__title{
    flex:none;
    font-size:clamp(1rem,3vmin,2.1rem);font-weight:900;color:var(--flame);
    text-align:center;line-height:1.35;
  }
  .end__title small{
    display:block;font-size:.62em;font-weight:700;
    color:var(--ink-2);opacity:.9;
  }

  /* ---------- 下方工具列 ---------- */
  .bar{
    position:relative;z-index:2;
    display:flex;align-items:center;gap:.5rem;
    padding:.4rem .7rem;
    background:rgba(64,38,15,.9);color:#F7E3B4;
    font-size:.8rem;
    transition:opacity .3s ease;
  }
  .bar.hide{opacity:0;pointer-events:none;}
  .bar button{
    font:inherit;font-weight:800;cursor:pointer;
    padding:.3rem .7rem;border-radius:.5rem;
    border:1px solid rgba(247,227,180,.35);
    background:transparent;color:inherit;
  }
  .bar button:hover{background:rgba(247,227,180,.16);}
  .bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar kbd{
    font:inherit;font-size:.9em;font-weight:900;
    padding:0 .3rem;border-radius:.25rem;background:rgba(247,227,180,.18);
  }
  .net{font-weight:800;white-space:nowrap;}
  .net.on{color:var(--green);}
  .net.off{color:#F0A0A0;}

  /* ---------- 點開放大的 DM ---------- */
  .promowall img{cursor:zoom-in;}
  .lightbox{
    position:fixed;inset:0;z-index:8;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2vmin;
    background:rgba(64,38,15,.93);
    padding:3vmin;
    cursor:zoom-out;
  }
  .lightbox img{
    max-width:100%;max-height:88%;
    width:auto;height:auto;display:block;
    border-radius:.6rem;
    box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.45);
  }
  .lightbox__hint{
    margin:0;color:#FDF2D8;opacity:.75;
    font-size:clamp(.85rem,2vmin,1.3rem);font-weight:800;
  }

  /* ---------- 跳頁選單 ---------- */
  .menu{
    position:fixed;inset:0;z-index:9;
    background:rgba(64,38,15,.94);color:#FDF2D8;
    padding:3vmin 6vmin;overflow:auto;
  }
  .menu h2{margin:0 0 2vmin;font-size:clamp(1.2rem,3.4vmin,2rem);}
  .menu ol{
    margin:0;padding:0;list-style:none;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.5rem;
  }
  .menu li{
    padding:.55rem .9rem;border-radius:.6rem;cursor:pointer;
    border:1px solid rgba(253,242,216,.2);
    font-size:clamp(.85rem,2vmin,1.05rem);
  }
  .menu li:hover{background:rgba(253,242,216,.14);}
  .menu li.on{background:var(--gold);color:#40260F;font-weight:900;}

</head>

  AFTER.wall = function (sc, el) {
    var wall = el.querySelector("#wall");
    if (!wall) { return; }

    var figs = Array.prototype.slice.call(wall.querySelectorAll("figure"));
    var pending = figs.length;

    function done() { if (--pending <= 0) { layout(); } }

    figs.forEach(function (fig) {
      var img = fig.querySelector("img");
      if (img.complete && img.naturalWidth) { done(); return; }
      img.addEventListener("load", done);
      img.addEventListener("error", function () {
        // 檔案還沒放進去就把那一格收掉，不要留破圖
        if (fig.parentNode) { fig.parentNode.removeChild(fig); }
        done();
      });
    });

    /**
     * 等高排版：同一列的照片高度一樣、寬度照原始比例，
     * 二分搜出「排得下的最大高度」，照片就會剛好鋪滿又不被裁到。
     */
    function layout() {
      var live = Array.prototype.slice.call(wall.querySelectorAll("figure"));
      if (!live.length) {
        wall.className = "wall wall--empty";
        wall.textContent = "照片還沒放進 media/photos/";
        return;
      }

      // layout() 會被呼叫不只一次（圖片載入完還會再跑一次）。
      // 下面會把 wall 的高度縮成內容高度，所以量之前一定要先還原，
      // 不然第二次會拿縮過的高度再縮一次，照片會越縮越小。
      wall.style.flex = "";
      wall.style.height = "";

      var W = wall.clientWidth, H = wall.clientHeight;
      var cs = getComputedStyle(live[0]);
      var frame = parseFloat(cs.borderLeftWidth) * 2;
      var gap = parseFloat(getComputedStyle(wall).columnGap) || 10;

      var shots = live.map(function (fig) {
        var img = fig.querySelector("img");
        var a = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1.5;
        return { el: fig, img: img, a: a };
      });

      var perRow = +wall.dataset.perRow || 0;

      /**
       * 某個高度會排成幾列；排不下就回 0。
       *
       * perRow 有指定的話，列數是固定的，只要檢查每一列的寬度塞不塞得下——
       * 貪心排法會把照片都擠到第一列，剩下兩張孤零零在第二列。
       */
      function rowsAt(h) {
        if (perRow) {
          var rows = Math.ceil(shots.length / perRow);
          for (var r = 0; r < rows; r++) {
            var wide = 0;
            for (var k = r * perRow; k < Math.min((r + 1) * perRow, shots.length); k++) {
              wide += shots[k].a * h + frame + (k > r * perRow ? gap : 0);
            }
            if (wide > W) { return 0; }
          }
          return rows;
        }

        var n = 1, used = 0;
        for (var i2 = 0; i2 < shots.length; i2++) {
          var w = shots[i2].a * h + frame;
          if (used > 0 && used + gap + w > W) { n++; used = w; }
          else { used = used ? used + gap + w : w; }
        }
        return n;
      }

      // 下限從 8 起跳、上限夾在容器高度內。
      // 以前下限寫死 40：容器比 40 還矮的時候（小視窗、或標題特別長）
      // 二分搜一次都不會成立，best 就停在 40，照片直接溢出去。
      var lo = 8, hi = Math.max(H, 8), best = Math.min(8, Math.max(H - frame, 1));
      for (var k = 0; k < 40; k++) {
        var mid = (lo + hi) / 2;
        var r = rowsAt(mid);
        if (r && r * (mid + frame) + (r - 1) * gap <= H) { best = mid; lo = mid; }
        else { hi = mid; }
      }

      var px = Math.max(1, Math.floor(Math.min(best, H - frame)));
      shots.forEach(function (sh) { sh.img.style.height = px + "px"; });

      // 照片排完通常用不到整塊高度，剩下的空白會卡在標題和照片之間。
      // 把容器縮成內容的實際高度，整組就會跟標題一起置中。
      var rows = rowsAt(px) || 1;
      wall.style.flex = "0 0 auto";
      wall.style.height = Math.ceil(rows * (px + frame) + (rows - 1) * gap) + "px";
    }

    if (!pending) { layout(); }
  };

      }).join("") +
      '</ul>';
  }

  VIEWS.lotteryIntro = function () {
    var url = (window.CDVC_CONFIG || {}).portalUrl || "";
    var qr = "";
    try { qr = url ? QR.svg(url) : ""; } catch (e) { qr = ""; }

    return '' +
      '<p class="eyebrow">🎁 Lucky Draw</p>' +
      '<h1 class="huge">抽獎時間<span class="en">Lucky Draw</span></h1>' +
      prizeList() +
      (qr
        ? '<div class="askqr">' +
            '<div class="qr">' + qr + "</div>" +
            '<div class="askqr__t"><b>' +
              bi("還沒填問卷的請掃這裡", "Not filled in the form yet? Scan here") + "</b>" +
              '<div class="askqr__u">' + esc(url) + "</div>" +
            "</div>" +
          "</div>"
        : "");
  };

  VIEWS.lotteryDraw = function () {
    var p = currentPrize();
    var names = pool();
    var won = history();

    var body;
    if (winner) {
      body = '<div class="roll win" id="roll">' + esc(winner.name) + '</div>';
    } else if (!names.length) {
      body = '<div class="roll empty" id="roll">名單是空的。請到後臺貼上參加者名單。</div>';
    } else {
      body = '<div class="roll" id="roll">？　？　？</div>';
    }

    return '' +
      '<p class="eyebrow">' + (p ? bi("現在抽", "Drawing now") : "🎁 Lucky Draw") + '</p>' +
      '<h1 class="big">' + esc(p ? p.name : "還沒選獎項") + '</h1>' +
      body +
      '<p class="lede quiet">' +
        (winner
          ? biHtml("恭喜 <b>" + esc(winner.name) + "</b>！請上台領獎。",
                   "Congratulations — come up and collect your prize.")
          : biHtml("剩下 <b>" + names.length + "</b> 位在名單裡　·　後臺按「開始抽獎」，或在這裡按 <b>T</b>",
                   names.length + " names left in the pool")) +
      '</p>' +
      (won.length
        ? '<div class="won">已中獎 Winners：' +
            won.map(function (h) {
              return '<b>' + esc(h.name) + '<small> ' + esc(h.prize || "") + '</small></b>';
            }).join("") +
          '</div>'
        : "");
  };

  /* ---------- 大合照 ---------- */
  VIEWS.photo = function () {
    if (photoCount) {
      return '<div class="count">' + (photoCount === 4 ? "📸" : photoCount) + '</div>';
    }
    return '' +
      '<div class="bigemoji">📸</div>' +
      '<h1 class="huge">大合照<span class="en">Group Photo</span></h1>';
  };

  /* ---------- 結束卡 ---------- */
  /* 這學期的活動宣傳圖，排法照迎新最後一頁 */
  /* 照活動日期排：中秋素烤 9/19、甜甜圈 9/23、迎新淨灘 10/3、戳戳繡 10/7、
     光影漫遊 11/7、鼠鼠志工 11/21、擴香石 11/25、STEAM 科學營 11/29 */
  var PROMOS = [
    "midmoon", "donut", "orientcamp", "punchneedle",
    "lightcamp", "rathero", "aromastone", "steamcamp"
  ];

  VIEWS.outro = function () {
    var url = (window.CDVC_CONFIG || {}).portalUrl || "";
    var qr = "";
    try { qr = url ? QR.svg(url) : ""; } catch (e) { qr = ""; }

    return '' +
      '<div class="endhead">' +
        '<div class="logos">' +
          '<img src="assets/logo1.webp" alt="崇德志工社">' +
          '<img src="assets/logo2.webp" alt="崇德志工社">' +
        "</div>" +
        "<div>" +
          '<h1 class="big">這學期的<span class="mark">活動</span>' +
            '<span class="en">This semester</span></h1>' +
          '<p class="endnote">' +
            bi("參加活動累積四枚，解鎖限定小禮", "Collect four stamps to unlock a limited gift") +
          "</p>" +
        "</div>" +
      "</div>" +
      '<div class="ends">' +
        '<div class="end end--promo">' +
          '<div class="promowall">' +
            PROMOS.map(function (n) {
              return '<img src="assets/' + n + '.webp" alt="近期活動" onerror="this.remove()">';
            }).join("") +
          "</div>" +
        "</div>" +
        (qr
          ? '<div class="end end--qr">' +
              '<div class="end__pic"><div class="qr">' + qr + "</div></div>" +
              '<div class="end__title">報名傳送門<small>Sign up</small></div>' +
            "</div>"
          : "") +
      "</div>";
  };

  /* ============================================================
     計時器
     ============================================================ */
  function startTimer(sec) {
    timer.total = sec;
    timer.left = sec;
    timer.running = true;
    paintTimer();
  }

  function paintTimer() {
    var el = $("timer");
    if (el) {
      el.textContent = timerText();
      el.className = "timer" + timerClass();
    }
  }

  setInterval(function () {
    if (!timer.running || timer.left <= 0) { return; }
    timer.left--;
    if (timer.left <= 0) { timer.running = false; }
    paintTimer();
  }, 1000);

  /* ============================================================
     抽獎：亂數與結果都在這裡決定，跑馬燈停在誰就是誰
     ============================================================ */
  function drawOne() {
    if (rolling) { return; }
    var names = pool();
    if (!names.length) { return; }

    var p = currentPrize();
    var prizeName = p ? p.name : "獎品";

    rolling = true;
    winner = null;
    render();

    var el = $("roll");
    if (!el) { rolling = false; return; }
    el.className = "roll spin";

    var at = 0;
    var spin = setInterval(function () {
      el.textContent = names[at % names.length];
      at++;
    }, 70);

    setTimeout(function () {
      clearInterval(spin);

      var n = pick(names.length);
      winner = { name: names[n], prize: prizeName };
      rolling = false;

      // 先畫再寫，網路慢的時候畫面也不會卡住。
      // 寫進 history 之後，下一次算 pool() 就不會再抽到這個人。
      render();
      NET.push("lottery/history", { name: winner.name, prize: prizeName, at: Date.now() });
    }, 2600);
  }

  /* ============================================================
     翻頁
     ============================================================ */
  function go(step) {
    var next = i + step;
    if (next < 0 || next >= S.length) { return; }
    i = next;
    winner = null;
    render();
  }

  function jump(n) {
    i = Math.max(0, Math.min(S.length - 1, n));
    winner = null;
    render();
  }

  function broadcast() {
    var sc = S[i];
    NET.set("state", {
      i: i,
      part: sc.part,
      kind: sc.kind,
      label: sc.label,
      total: S.length,
      updatedAt: Date.now()
    });
  }

  /* ============================================================
     鍵盤
     ============================================================ */
  document.addEventListener("keydown", function (e) {
    var sc = S[i];
    startMusic();          // 被瀏覽器擋掉的話，主持人一按鍵就補播

    if (e.key === "Escape") {
      e.preventDefault();
      // 放大圖開著的時候，Esc 先關它
      if (!$("lightbox").hidden) { closeBox(); return; }
      toggleMenu();
      return;
    }
    if (!$("lightbox").hidden) { closeBox(); return; }
    if (!$("menu").hidden) { return; }

    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") {
      e.preventDefault(); go(1); return;
    }
    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); go(-1); return;
    }

    var k = e.key.toLowerCase();

    if (k === "f") { toggleFull(); return; }

    if (k === "m") { toggleMute(); return; }

    if (k === "l" && sc.kind === "monkeyRules") { toggleLang(); return; }

    if (k === "t") {
      if (sc.kind === "photo") { runPhotoCountdown(); return; }
      if (sc.kind === "lotteryDraw") { drawOne(); return; }
      if (sc.kind === "monkeyPlay") {
        if (timer.total) { timer.running = !timer.running; paintTimer(); }
        else { startTimer(90); }
      }
      return;
    }

    if (k === "r") {
      if (sc.kind === "monkeyPlay") { timer = { left: 0, total: 0, running: false }; render(); }
      if (sc.kind === "photo") { photoCount = 0; render(); }
      if (sc.kind === "lotteryDraw") { winner = null; render(); }
      return;
    }
  });

  function runPhotoCountdown() {
    if (photoCount) { return; }
    var seq = [3, 2, 1, 4];   // 4 是快門那一格
    var at = 0;
    (function step() {
      photoCount = seq[at];
      render();
      at++;
      if (at < seq.length) { setTimeout(step, 1000); }
      else { setTimeout(function () { photoCount = 0; render(); }, 2500); }
    })();
  }

  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen()["catch"](function () {}); }
  }

  function toggleMenu() {
    var m = $("menu");
    if (m.hidden) {
      $("menulist").innerHTML = S.map(function (s, n) {
        return '<li data-jump="' + n + '" class="' + (n === i ? "on" : "") + '">' +
          '<i>' + (n + 1) + '</i>' + esc(s.label) + '</li>';
      }).join("");
    }
    m.hidden = !m.hidden;
  }

  /* ============================================================
     配樂

     整場一首，翻頁不中斷。瀏覽器規定要先有互動才能播，
     所以第一次出聲是在主持人按下第一個鍵（或點畫面）之後。
     ============================================================ */
  var MUSIC_SRC = "assets/volunteer.mp3";
  var VOLUME = 0.28;
  var track = null;
  var muted = false;

  function paintMute() {
    var b = $("b-mute");
    b.textContent = (muted ? "🔇" : "🔊") + " 音樂 (M)";
    b.title = muted ? "已靜音" : "播放中：" + MUSIC_SRC.split("/").pop();
  }

  function startMusic() {
    if (muted) { return; }
    if (!track) {
      track = new Audio(MUSIC_SRC);
      track.loop = true;
      track.preload = "auto";
      track.volume = VOLUME;
    }
    if (track.paused) {
      track.play()["catch"](function () {
        /* 還沒有互動就被擋掉，下一次按鍵會再試一次 */
      });
    }
  }

  function toggleMute() {
    muted = !muted;
    if (muted && track) { track.pause(); }
    else { startMusic(); }
    paintMute();
  }

  paintMute();

  /* ============================================================
     滑鼠、按鈕
     ============================================================ */
  var hideAt = null;

  function poke() {
    $("bar").classList.remove("hide");
    clearTimeout(hideAt);
    hideAt = setTimeout(function () { $("bar").classList.add("hide"); }, 3000);
  }

  document.addEventListener("mousemove", poke);
  poke();

  $("b-prev").addEventListener("click", function () { go(-1); });
  $("b-next").addEventListener("click", function () { go(1); });
  $("b-menu").addEventListener("click", toggleMenu);
  $("b-full").addEventListener("click", toggleFull);
  $("b-mute").addEventListener("click", toggleMute);

  // 規則頁的中英切換：按鈕或 L 鍵都行
  function toggleLang() {
    lang = lang === "zh" ? "en" : "zh";
    render();
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("#b-lang")) { toggleLang(); return; }

    var dm = e.target.closest(".promowall img");
    if (dm) { openBox(dm.src); return; }
    if (e.target.closest("#lightbox")) { closeBox(); }
  });

  function openBox(src) {
    $("lightbox-img").src = src;
    $("lightbox").hidden = false;
  }

  function closeBox() {
    $("lightbox").hidden = true;
    $("lightbox-img").src = "";
  }

  $("menu").addEventListener("click", function (e) {
    var li = e.target.closest("[data-jump]");
    if (!li) { return; }
    jump(+li.dataset.jump);
    $("menu").hidden = true;
  });

  /* ============================================================
     連線
     ============================================================ */
  NET.onStatus = function (ok) {
    var el = $("netinfo");
    el.textContent = ok ? "● 已連線" : "● 連線中斷";
    el.className = "net " + (ok ? "on" : "off");
  };

  NET.init("stage").then(function (r) {
    if (r.mode === "local") {
      $("netinfo").textContent = "● 本機模式（手機不會同步）";
      $("netinfo").className = "net off";
    }

    NET.on("monkey", function (m) {
      // 後臺第一次開之前資料庫是空的，先讓投影幕用預設題庫撐著
      monkey = m || { terms: MONKEY.TERMS, at: 0 };
      if (S[i].kind === "monkeyPlay") { render(); }
    });

    NET.on("lottery", function (l) {
      lottery = l || {};

      // 後臺按下「開始抽獎」。用 seq 擋掉重播，重整投影幕不會又抽一次。
      var d = lottery.draw || {};
      if (!ready.lottery) {
        ready.lottery = true;
        lastDrawSeq = d.seq || 0;          // 開機當下那筆是上一場留下來的，不算
      } else if (d.seq && d.seq > lastDrawSeq) {
        lastDrawSeq = d.seq;
        if (S[i].kind === "lotteryDraw") { drawOne(); return; }
      }

      // 後臺按了重設，畫面上那位已經回到名單裡了，不要再掛在投影幕上
      if (winner && !history().length) { winner = null; }

      if (S[i].part === "lottery") { render(); }
    });

    NET.on("control", function (c) {
      c = c || {};

      // 同上：第一次回呼是開機基準，之後的才是後臺真的按了按鈕
      if (!ready.control) {
        ready.control = true;
        lastControlSeq = c.seq || 0;
        return;
      }
      if (!c.seq || c.seq <= lastControlSeq) { return; }
      lastControlSeq = c.seq;

      if (c.cmd === "next") { go(1); }
      else if (c.cmd === "prev") { go(-1); }
      else if (c.cmd === "goto") { jump(+c.n || 0); }
      else if (c.cmd === "photo") { runPhotoCountdown(); }
    });

    // 把流程目錄交給後臺，遙控的「跳到哪一頁」才知道有哪些頁
    NET.set("outline", S.map(function (s) {
      return { label: s.label, part: PARTS[s.part] };
    }));

    render();
  });
})();
</script>
</body>
</html>
